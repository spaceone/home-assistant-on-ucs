@!@
import re

v = configRegistry.get
name = v('homeassistant/domain', 'homeassistant.example.invalid').lower().strip()
port = v('homeassistant/http-port', '8123')
if not re.fullmatch(r'[a-z0-9.-]+', name) or not port.isdigit():
    raise ValueError('Invalid domain or port')

if configRegistry.is_true('homeassistant/apache/enabled', True):
    host = v('hostname', 'localhost')
    domain = v('domainname', 'example.invalid')
    hostcert = '/etc/univention/ssl/' + host + '.' + domain

    print('<VirtualHost *:443>')
    print('  ServerName ' + name)
    print('  SSLEngine On')
    print('  SSLCertificateFile ' + hostcert + '/cert.pem')
    print('  SSLCertificateKeyFile ' + hostcert + '/private.key')
    print('  RequestHeader set X-Forwarded-Proto "https"')
    print('  RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"')
    print('  ProxyPreserveHost On')
    print('  ProxyRequests Off')
    print('  ProxyPass /api/websocket ws://127.0.0.1:' + port + '/api/websocket')
    print('  ProxyPassReverse /api/websocket ws://127.0.0.1:' + port + '/api/websocket')
    print('  ProxyPass / http://127.0.0.1:' + port + '/ retry=0')
    print('  ProxyPassReverse / http://127.0.0.1:' + port + '/')
    print('</VirtualHost>')
@!@
